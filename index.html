<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ott log - 영화 & 도서 기록장</title>
    <!-- 구글 폰트 연동 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nanum+Gothic:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;700;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0f0f12;
            --card-bg: #18181c;
            --card-border: #2a2a30;
            --text-main: #f0f0f5;
            --text-sub: #8a8a93;
            --accent-color: #7c4dff;
            --font-family: 'Noto Sans KR', sans-serif;
        }

        [data-theme="light"] {
            --bg-color: #f4f5f8;
            --card-bg: #ffffff;
            --card-border: #e1e3e8;
            --text-main: #1a1a1e;
            --text-sub: #6c6d75;
            --accent-color: #6200ee;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-family);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 60px;
            transition: background-color 0.3s, color 0.3s;
        }

        header {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid var(--card-border);
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: -0.5px;
            color: var(--text-main);
        }

        .header-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .font-select, .theme-picker {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--card-border);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
        }

        .theme-picker {
            width: 32px;
            height: 32px;
            padding: 0;
            border-radius: 50%;
            border: none;
        }

        .btn {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--card-border);
        }

        .btn-danger {
            background-color: #ff5252;
            color: #fff;
            border: none;
        }

        nav {
            width: 100%;
            max-width: 800px;
            display: flex;
            gap: 20px;
            padding: 15px 20px;
            border-bottom: 1px solid var(--card-border);
        }

        .nav-item {
            color: var(--text-sub);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            padding-bottom: 5px;
        }

        .nav-item.active {
            color: var(--text-main);
            border-bottom: 2px solid var(--text-main);
        }

        .sub-nav {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .sub-nav-item {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-sub);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .sub-nav-item.active {
            background-color: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        main {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* Profile Card */
        .profile-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            gap: 20px;
            align-items: center;
            position: relative;
        }

        .profile-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--card-border);
        }

        .profile-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }

        .profile-name {
            font-size: 18px;
            font-weight: 700;
        }

        .profile-bio {
            font-size: 14px;
            color: var(--text-sub);
        }

        .edit-profile-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 6px 12px;
            font-size: 12px;
        }

        /* Calendar */
        .calendar-container {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .calendar-title {
            font-size: 17px;
            font-weight: 700;
        }

        .calendar-nav button {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            text-align: center;
        }

        .day-name {
            font-size: 12px;
            color: var(--text-sub);
            padding-bottom: 8px;
            font-weight: 600;
        }

        .day-cell {
            aspect-ratio: 1 / 1.3;
            background-color: rgba(255,255,255,0.02);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            padding: 4px;
            position: relative;
            overflow: hidden;
            font-size: 12px;
            color: var(--text-sub);
            cursor: pointer;
        }

        .day-number {
            position: absolute;
            top: 4px;
            left: 4px;
            z-index: 2;
            font-weight: 600;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }

        .poster-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 6px;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Grid View (Movies/Dramas) */
        .item-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
        }

        .media-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        .media-poster {
            width: 100%;
            aspect-ratio: 2 / 3;
            object-fit: cover;
        }

        .media-info {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .media-title {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .media-rating {
            font-size: 12px;
            color: #ffd700;
        }

        /* Bookshelf View (책장 스타일) */
        .bookshelf-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .bookshelf-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            padding: 15px 15px 5px 15px;
            background: linear-gradient(to bottom, transparent 80%, rgba(139, 69, 19, 0.3) 80%);
            border-bottom: 12px solid #5c3a21; /* 나무 책장 판자 느낌 */
            border-radius: 4px;
            min-height: 180px;
            align-items: flex-end;
        }

        .book-item {
            width: 90px;
            height: 135px;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 4px 8px 8px 4px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 3px 3px 10px rgba(0,0,0,0.5);
            transition: transform 0.2s;
            position: relative;
        }

        .book-item:hover {
            transform: translateY(-5px);
        }

        .book-cover {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Repov Style Detail Feed View (레포브 스타일 피드 상세 화면) */
        .repov-feed {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .feed-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .feed-item-info {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .feed-poster {
            width: 60px;
            height: 85px;
            object-fit: cover;
            border-radius: 8px;
        }

        .feed-meta h3 {
            font-size: 16px;
            font-weight: 700;
        }

        .feed-meta p {
            font-size: 13px;
            color: var(--text-sub);
        }

        .feed-date {
            font-size: 13px;
            color: var(--text-sub);
            border-left: 2px solid var(--accent-color);
            padding-left: 8px;
        }

        .feed-rating-stars {
            font-size: 15px;
            color: #ffd700;
            font-weight: 700;
        }

        .feed-review {
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-main);
            white-space: pre-wrap;
            background: rgba(0,0,0,0.15);
            padding: 12px;
            border-radius: 8px;
        }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            width: 90%;
            max-width: 480px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 13px;
            color: var(--text-sub);
            font-weight: 600;
        }

        .form-group input, .form-group select, .form-group textarea {
            background-color: var(--bg-color);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }

        /* 기본 프로필 선택 칩 디자인 */
        .default-avatars {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        .preset-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            cursor: pointer;
            border: 2px solid var(--card-border);
            transition: border-color 0.2s;
        }

        .preset-avatar:hover {
            border-color: var(--accent-color);
        }

        .search-results {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        .search-item {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 10px;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            cursor: pointer;
        }

        .search-thumb {
            width: 45px;
            height: 60px;
            object-fit: cover;
            border-radius: 4px;
        }

        .fab {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            font-size: 26px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            z-index: 10;
        }
    </style>
</head>
<body data-theme="dark">

    <header>
        <div class="logo">Ott log</div>
        <div class="header-controls">
            <select id="fontSelect" class="font-select">
                <option value="'Noto Sans KR', sans-serif">기본 (Noto Sans)</option>
                <option value="'Nanum Gothic', sans-serif">나눔고딕</option>
                <option value="'Gowun Dodum', sans-serif">고운돋움</option>
                <option value="'Poppins', sans-serif">Poppins (영문강조)</option>
            </select>
            <input type="color" id="accentPicker" class="theme-picker" value="#7c4dff" title="포인트 색상">
            <button class="btn btn-secondary" id="themeToggle">🌙</button>
        </div>
    </header>

    <nav>
        <div class="nav-item active" data-tab="calendar">캘린더</div>
        <div class="nav-item" data-tab="wish">시청예정</div>
        <div class="nav-item" data-tab="watched">시청완료</div>
    </nav>

    <main>
        <!-- 프로필 카드 -->
        <section class="profile-card">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200&auto=format&fit=crop" id="displayProfileImg" class="profile-img" alt="Profile">
            <div class="profile-info">
                <div class="profile-name" id="displayName">시네필 회원님</div>
                <div class="profile-bio" id="displayBio">영화와 책을 기록하는 나만의 OTT LOG입니다.</div>
            </div>
            <button class="btn btn-secondary edit-profile-btn" id="openEditProfile">수정</button>
        </section>

        <!-- 캘린더 탭 -->
        <section id="calendarTab">
            <div class="calendar-container">
                <div class="calendar-header">
                    <div class="calendar-title" id="calendarMonthTitle">2026.03</div>
                    <div class="calendar-nav">
                        <button id="prevMonth">◀</button>
                        <button id="nextMonth">▶</button>
                    </div>
                </div>
                <div class="calendar-grid" id="calendarGrid"></div>
            </div>
        </section>

        <!-- 시청예정 탭 -->
        <section id="wishTab" style="display: none;">
            <div class="item-grid" id="wishGrid"></div>
        </section>

        <!-- 시청완료 탭 (영화 / 드라마 / 책 하위 탭) -->
        <section id="watchedTab" style="display: none;">
            <div class="sub-nav">
                <div class="sub-nav-item active" data-sub="movie">영화</div>
                <div class="sub-nav-item" data-sub="drama">드라마</div>
                <div class="sub-nav-item" data-sub="book">책 (책장)</div>
            </div>
            <div id="watchedContentContainer"></div>
        </section>
    </main>

    <button class="fab" id="openSearchModal">+</button>

    <!-- 프로필 수정 모달 -->
    <div class="modal-overlay" id="profileModal">
        <div class="modal-card">
            <div class="modal-title">프로필 수정</div>
            <div class="form-group">
                <label>이름 / 닉네임</label>
                <input type="text" id="editName">
            </div>
            <div class="form-group">
                <label>기본 프로필 캐릭터 선택</label>
                <div class="default-avatars">
                    <img src="https://github.com/lee-max666/mars.github.io/blob/main/%E2%98%85.jpg?raw=true" class="preset-avatar" onclick="setPresetAvatar(this.src)">
                    <img src="https://github.com/lee-max666/mars.github.io/blob/main/%E2%98%85%20(1).jpg?raw=true" class="preset-avatar" onclick="setPresetAvatar(this.src)">
                    <img src="https://github.com/lee-max666/mars.github.io/blob/main/%E2%98%85%20(2).jpg?raw=true" class="preset-avatar" onclick="setPresetAvatar(this.src)">
                </div>
            </div>
            <div class="form-group">
                <label>또는 내 사진 파일 직접 업로드</label>
                <input type="file" id="editFile" accept="image/*">
            </div>
            <div class="form-group">
                <label>프로필 이미지 주소(URL)</label>
                <input type="text" id="editImg">
            </div>
            <div class="form-group">
                <label>한줄 소개</label>
                <input type="text" id="editBio">
            </div>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button class="btn" style="flex:1" id="saveProfileBtn">저장</button>
                <button class="btn btn-secondary" style="flex:1" id="closeProfileBtn">취소</button>
            </div>
        </div>
    </div>

    <!-- 검색 및 기록 추가 모달 (미키17, 기생충 예시 반영) -->
    <div class="modal-overlay" id="searchModal">
        <div class="modal-card">
            <div class="modal-title">작품 검색 및 등록</div>
            <div class="form-group">
                <label>카테고리</label>
                <select id="searchType">
                    <option value="movie">영화</option>
                    <option value="drama">드라마</option>
                    <option value="book">책</option>
                </select>
            </div>
            <div class="form-group">
                <label>한국어 제목 검색</label>
                <input type="text" id="searchInput" placeholder="예: 미키 17, 기생충...">
            </div>
            <div class="search-results" id="searchResults"></div>
            <button class="btn btn-secondary" id="closeSearchBtn" style="margin-top: 10px;">닫기</button>
        </div>
    </div>

    <!-- 레포브 스타일 상세 피드 / 수정 모달 -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-card">
            <div class="feed-header">
                <div class="modal-title">상세 기록 피드</div>
                <button class="btn btn-secondary" id="toggleEditModeBtn" style="font-size:12px; padding:4px 10px;">수정</button>
            </div>
            <input type="hidden" id="detailId">

            <!-- 읽기 전용 피드 뷰 (평소에는 깔끔하게 감상문만 표시) -->
            <div id="feedReadView" style="display:flex; flex-direction:column; gap:12px;">
                <div class="feed-item-info">
                    <img id="feedPoster" class="feed-poster" src="">
                    <div class="feed-meta">
                        <h3 id="feedTitleText">작품 제목</h3>
                        <p id="feedCategoryText">영화</p>
                        <div class="feed-rating-stars" id="feedStarsText">⭐⭐⭐⭐⭐ 5.0</div>
                    </div>
                </div>
                <div class="feed-date" id="feedDateText">2026.03.15 (Sun)</div>
                <div class="feed-review" id="feedReviewText">남겨진 감상 후기가 없습니다.</div>
            </div>

            <!-- 편집 뷰 (우측 상단 '수정' 버튼을 누를 때만 활성화) -->
            <div id="feedEditView" style="display:none; flex-direction:column; gap:12px;">
                <div class="form-group">
                    <label>상태 분류</label>
                    <select id="detailStatus">
                        <option value="watched">시청완료 (달력 표시)</option>
                        <option value="wish">시청예정</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>카테고리</label>
                    <select id="detailCategory">
                        <option value="movie">영화</option>
                        <option value="drama">드라마</option>
                        <option value="book">책</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>완료 날짜 (YYYY-MM-DD)</label>
                    <input type="date" id="detailDate">
                </div>
                <div class="form-group">
                    <label>평점 & 별점 시각화: <span id="ratingValueText" style="color:#ffd700; font-weight:bold; font-size:15px;">5.0</span> (<span id="ratingStarPreview">⭐⭐⭐⭐⭐</span>)</label>
                    <input type="range" id="detailRating" min="0" max="5" step="0.1" value="5">
                </div>
                <div class="form-group">
                    <label>감상 후기</label>
                    <textarea id="detailReview" rows="4" placeholder="작품에 대한 생각과 느낀점을 기록해 보세요."></textarea>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 5px;">
                    <button class="btn" style="flex:1" id="saveDetailBtn">저장하기</button>
                    <button class="btn btn-danger" style="flex:1" id="deleteDetailBtn">삭제</button>
                </div>
            </div>

            <button class="btn btn-secondary" id="closeDetailBtn" style="margin-top: 5px;">닫기</button>
        </div>
    </div>

    <script>
        // Data Management (Local Storage)
        let profile = JSON.parse(localStorage.getItem('ottlog_profile')) || {
            name: "시네필 회원님",
            bio: "영화와 책을 기록하는 나만의 OTT LOG입니다.",
            img: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200&auto=format&fit=crop"
        };

        let currentFont = localStorage.getItem('ottlog_font') || "'Noto Sans KR', sans-serif";

        let records = JSON.parse(localStorage.getItem('ottlog_records')) || [
            { id: 1, type: 'movie', title: '미키 17', date: '2026-03-05', poster: 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=300&auto=format&fit=crop', status: 'watched', rating: 4.8, review: '연출과 철학적인 스토리가 무척 인상적이었다. 꼭 봐야 하는 작품.' },
            { id: 2, type: 'book', title: '기생충 스토리북', date: '2026-03-12', poster: 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=300&auto=format&fit=crop', status: 'watched', rating: 4.5, review: '시나리오의 디테일과 각본의 매력을 책으로 다시 느껴본다.' },
            { id: 3, type: 'drama', title: '기묘한 이야기', date: '', poster: 'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=300&auto=format&fit=crop', status: 'wish', rating: 5.0, review: '' }
        ];

        let currentDate = new Date(2026, 2, 1);
        let currentSubTab = 'movie';

        // Font Setup
        const fontSelect = document.getElementById('fontSelect');
        document.body.style.fontFamily = currentFont;
        fontSelect.value = currentFont;

        fontSelect.addEventListener('change', (e) => {
            currentFont = e.target.value;
            document.body.style.fontFamily = currentFont;
            localStorage.setItem('ottlog_font', currentFont);
        });

        // Profile Functions
        function renderProfile() {
            document.getElementById('displayName').textContent = profile.name;
            document.getElementById('displayBio').textContent = profile.bio;
            document.getElementById('displayProfileImg').src = profile.img;
        }

        function setPresetAvatar(url) {
            document.getElementById('editImg').value = url;
        }

        document.getElementById('openEditProfile').addEventListener('click', () => {
            document.getElementById('editName').value = profile.name;
            document.getElementById('editImg').value = profile.img;
            document.getElementById('editBio').value = profile.bio;
            document.getElementById('profileModal').classList.add('active');
        });

        document.getElementById('closeProfileBtn').addEventListener('click', () => {
            document.getElementById('profileModal').classList.remove('active');
        });

        document.getElementById('editFile').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    document.getElementById('editImg').value = evt.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('saveProfileBtn').addEventListener('click', () => {
            profile.name = document.getElementById('editName').value;
            profile.img = document.getElementById('editImg').value || profile.img;
            profile.bio = document.getElementById('editBio').value;
            localStorage.setItem('ottlog_profile', JSON.stringify(profile));
            renderProfile();
            document.getElementById('profileModal').classList.remove('active');
        });

        // Theme Toggle
        document.getElementById('themeToggle').addEventListener('click', () => {
            const isDark = document.body.getAttribute('data-theme') === 'dark';
            document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
            document.getElementById('themeToggle').textContent = isDark ? '☀️' : '🌙';
        });

        document.getElementById('accentPicker').addEventListener('input', (e) => {
            document.documentElement.style.setProperty('--accent-color', e.target.value);
        });

        // Main Tab Switch
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                item.classList.add('active');
                const tab = item.getAttribute('data-tab');
                document.getElementById('calendarTab').style.display = tab === 'calendar' ? 'block' : 'none';
                document.getElementById('wishTab').style.display = tab === 'wish' ? 'block' : 'none';
                document.getElementById('watchedTab').style.display = tab === 'watched' ? 'block' : 'none';

                if (tab === 'wish') renderWish();
                if (tab === 'watched') renderWatched();
            });
        });

        // Sub Tab Switch (영화 / 드라마 / 책)
        document.querySelectorAll('.sub-nav-item').forEach(sub => {
            sub.addEventListener('click', () => {
                document.querySelectorAll('.sub-nav-item').forEach(s => s.classList.remove('active'));
                sub.classList.add('active');
                currentSubTab = sub.getAttribute('data-sub');
                renderWatched();
            });
        });

        // Calendar Render
        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            document.getElementById('calendarMonthTitle').textContent = `${year}.${String(month + 1).padStart(2, '0')}`;

            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';

            ['일', '월', '화', '수', '목', '금', '토'].forEach(d => {
                const dh = document.createElement('div');
                dh.className = 'day-name';
                dh.textContent = d;
                grid.appendChild(dh);
            });

            const firstDay = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < firstDay; i++) {
                grid.appendChild(document.createElement('div'));
            }

            for (let day = 1; day <= totalDays; day++) {
                const cell = document.createElement('div');
                cell.className = 'day-cell';
                cell.innerHTML = `<span class="day-number">${day}</span>`;

                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const matchedRecord = records.find(r => r.date === dateStr && r.status === 'watched');

                if (matchedRecord) {
                    const img = document.createElement('img');
                    img.src = matchedRecord.poster;
                    img.className = 'poster-img';
                    cell.appendChild(img);
                    cell.addEventListener('click', () => openDetailModal(matchedRecord.id));
                }

                grid.appendChild(cell);
            }
        }

        document.getElementById('prevMonth').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        });

        document.getElementById('nextMonth').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        });

        // Wish Render
        function renderWish() {
            const grid = document.getElementById('wishGrid');
            grid.innerHTML = '';
            const wishes = records.filter(r => r.status === 'wish');

            wishes.forEach(item => {
                const card = document.createElement('div');
                card.className = 'media-card';
                card.innerHTML = `
                    <img src="${item.poster}" class="media-poster">
                    <div class="media-info">
                        <div class="media-title">${item.title}</div>
                        <div class="media-rating">⭐ ${item.rating || 5.0}</div>
                    </div>
                `;
                card.addEventListener('click', () => openDetailModal(item.id));
                grid.appendChild(card);
            });
        }

        // Watched Render (영화, 드라마는 그리드 / 책은 아기자기한 입체 책장 스타일)
        function renderWatched() {
            const container = document.getElementById('watchedContentContainer');
            container.innerHTML = '';
            const watchedList = records.filter(r => r.status === 'watched' && r.type === currentSubTab);

            if (currentSubTab === 'book') {
                // 책장(Bookshelf) UI 구현
                const shelfDiv = document.createElement('div');
                shelfDiv.className = 'bookshelf-container';
                
                const rowDiv = document.createElement('div');
                rowDiv.className = 'bookshelf-row';

                if (watchedList.length === 0) {
                    rowDiv.innerHTML = `<div style="color:var(--text-sub); font-size:13px; padding:10px;">등록된 책이 없습니다. 책장에 책을 꽂아보세요!</div>`;
                }

                watchedList.forEach(item => {
                    const book = document.createElement('div');
                    book.className = 'book-item';
                    book.innerHTML = `<img src="${item.poster}" class="book-cover">`;
                    book.addEventListener('click', () => openDetailModal(item.id));
                    rowDiv.appendChild(book);
                });

                shelfDiv.appendChild(rowDiv);
                container.appendChild(shelfDiv);
            } else {
                // 영화 및 드라마 일반 포스터 그리드
                const grid = document.createElement('div');
                grid.className = 'item-grid';

                watchedList.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'media-card';
                    card.innerHTML = `
                        <img src="${item.poster}" class="media-poster">
                        <div class="media-info">
                            <div class="media-title">${item.title}</div>
                            <div class="media-rating">⭐ ${item.rating || 5.0}</div>
                        </div>
                    `;
                    card.addEventListener('click', () => openDetailModal(item.id));
                    grid.appendChild(card);
                });
                container.appendChild(grid);
            }
        }

        // Search Modal (미키17, 기생충 예시 반영)
        document.getElementById('openSearchModal').addEventListener('click', () => {
            document.getElementById('searchModal').classList.add('active');
        });

        document.getElementById('closeSearchBtn').addEventListener('click', () => {
            document.getElementById('searchModal').classList.remove('active');
        });

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.trim();
            const container = document.getElementById('searchResults');
            container.innerHTML = '';

            if (!query) return;

            const mockResults = [
                { title: query, poster: 'https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?w=200&auto=format&fit=crop' },
                { title: query + ' (디렉터스컷)', poster: 'https://images.unsplash.com/photo-1543002588-bfa74002ed7e?w=200&auto=format&fit=crop' }
            ];

            mockResults.forEach(res => {
                const item = document.createElement('div');
                item.className = 'search-item';
                item.innerHTML = `
                    <img src="${res.poster}" class="search-thumb">
                    <div style="flex:1; font-weight:600;">${res.title}</div>
                    <button class="btn" style="font-size:11px;">+ 선택</button>
                `;
                item.addEventListener('click', () => {
                    const selectedType = document.getElementById('searchType').value;
                    const newRec = {
                        id: Date.now(),
                        type: selectedType,
                        title: res.title,
                        date: '2026-03-15',
                        poster: res.poster,
                        status: 'watched',
                        rating: 5.0,
                        review: '새롭게 추가된 작품입니다. 감상 후기를 남겨보세요!'
                    };
                    records.push(newRec);
                    localStorage.setItem('ottlog_records', JSON.stringify(records));
                    renderCalendar();
                    document.getElementById('searchModal').classList.remove('active');
                    openDetailModal(newRec.id);
                });
                container.appendChild(item);
            });
        });

        // Detail / Read-Only & Edit Feed Mode Toggle
        const ratingSlider = document.getElementById('detailRating');
        const ratingValueText = document.getElementById('ratingValueText');
        const ratingStarPreview = document.getElementById('ratingStarPreview');

        ratingSlider.addEventListener('input', (e) => {
            const val = Number(e.target.value).toFixed(1);
            ratingValueText.textContent = val;
            const fullStars = Math.floor(val);
            ratingStarPreview.textContent = '⭐'.repeat(fullStars) + (val % 1 >= 0.5 ? '✨' : '');
        });

        let isEditMode = false;

        function openDetailModal(id) {
            const item = records.find(r => r.id === id);
            if (!item) return;

            isEditMode = false;
            updateDetailViewMode();

            document.getElementById('detailId').value = item.id;
            
            // 피드 읽기 전용 뷰 채우기
            document.getElementById('feedPoster').src = item.poster;
            document.getElementById('feedTitleText').textContent = item.title;
            document.getElementById('feedCategoryText').textContent = item.type === 'movie' ? '🎬 영화' : (item.type === 'drama' ? '📺 드라마' : '📚 책');
            const ratingNum = item.rating || 5.0;
            document.getElementById('feedStarsText.textContent = `⭐ ${ratingNum}`;
            document.getElementById('feedDateText').textContent = item.date ? `${item.date} 기록됨` : '날짜 미지정';
            document.getElementById('feedReviewText').textContent = item.review || '작성된 감상 후기가 없습니다.';

            // 편집 뷰 폼 채우기
            document.getElementById('detailStatus').value = item.status;
            document.getElementById('detailCategory').value = item.type;
            document.getElementById('detailDate').value = item.date || '2026-03-15';
            ratingSlider.value = ratingNum;
            ratingValueText.textContent = Number(ratingNum).toFixed(1);
            ratingStarPreview.textContent = '⭐'.repeat(Math.floor(ratingNum));
            document.getElementById('detailReview').value = item.review || '';

            document.getElementById('detailModal').classList.add('active');
        }

        function updateDetailViewMode() {
            const readView = document.getElementById('feedReadView');
            const editView = document.getElementById('feedEditView');
            const toggleBtn = document.getElementById('toggleEditModeBtn');

            if (isEditMode) {
                readView.style.display = 'none';
                editView.style.display = 'flex';
                toggleBtn.textContent = '보기';
            } else {
                readView.style.display = 'flex';
                editView.style.display = 'none';
                toggleBtn.textContent = '수정';
            }
        }

        document.getElementById('toggleEditModeBtn').addEventListener('click', () => {
            isEditMode = !isEditMode;
            updateDetailViewMode();
        });

        document.getElementById('closeDetailBtn').addEventListener('click', () => {
            document.getElementById('detailModal').classList.remove('active');
        });

        document.getElementById('saveDetailBtn').addEventListener('click', () => {
            const id = Number(document.getElementById('detailId').value);
            const index = records.findIndex(r => r.id === id);
            if (index !== -1) {
                records[index].status = document.getElementById('detailStatus').value;
                records[index].type = document.getElementById('detailCategory').value;
                records[index].date = document.getElementById('detailDate').value;
                records[index].rating = parseFloat(ratingSlider.value);
                records[index].review = document.getElementById('detailReview').value;

                localStorage.setItem('ottlog_records', JSON.stringify(records));
                renderCalendar();
                renderWish();
                renderWatched();
                document.getElementById('detailModal').classList.remove('active');
            }
        });

        document.getElementById('deleteDetailBtn').addEventListener('click', () => {
            if (confirm("정말로 이 기록을 삭제하시겠습니까?")) {
                const id = Number(document.getElementById('detailId').value);
                records = records.filter(r => r.id !== id);
                localStorage.setItem('ottlog_records', JSON.stringify(records));
                renderCalendar();
                renderWish();
                renderWatched();
                document.getElementById('detailModal').classList.remove('active');
            }
        });

        // Init App
        renderProfile();
        renderCalendar();
    </script>
</body>
</html>
