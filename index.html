<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repov Media Archive</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0e1015;
            --card-bg: #171922;
            --card-border: #282b37;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent-color: #6366f1;
            --accent-text: #ffffff;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
            padding-bottom: 80px;
        }

        .custom-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
        }

        .accent-bg {
            background-color: var(--accent-color) !important;
            color: var(--accent-text) !important;
        }

        .accent-border {
            border-color: var(--accent-color) !important;
        }

        .accent-text {
            color: var(--accent-color) !important;
        }

        /* Hide Scrollbar */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .aspect-poster {
            aspect-ratio: 2 / 3;
        }

        /* Realistic Book Spine View Styling */
        .shelf-divider {
            height: 12px;
            background: linear-gradient(180deg, #3d271d 0%, #261710 100%);
            border-top: 2px solid #5a3c2e;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6);
            border-radius: 2px;
        }

        .book-spine {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: -3px 0 6px rgba(0,0,0,0.4) inset, 2px 0 5px rgba(0,0,0,0.3);
        }

        .book-spine:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: -3px 0 8px rgba(0,0,0,0.5) inset, 4px 4px 12px rgba(0,0,0,0.6);
        }

        /* Color Picker Custom Styles */
        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 9999px;
        }
    </style>
</head>
<body class="min-h-screen text-sm selection:bg-indigo-500 selection:text-white">

    <div class="max-w-md mx-auto min-h-screen flex flex-col justify-between relative bg-[#0e1015] shadow-2xl border-x border-[#1e212b]">

        <!-- 상단 헤더 & 네비게이션 탭 -->
        <header class="sticky top-0 z-30 bg-[#0e1015]/95 backdrop-blur-md border-b border-[#282b37] px-4 pt-3 pb-2">
            <div class="flex justify-between items-center mb-3">
                <div class="flex items-center gap-2">
                    <h1 class="text-xl font-black tracking-tight text-white font-['Poppins']">REPOV</h1>
                    <span class="text-[10px] px-2 py-0.5 rounded-full bg-gray-800 text-gray-400 font-mono">v2.5</span>
                </div>
                
                <!-- 상단 컨트롤: 스마트 테마 커스텀 피커 & 추가 버튼 -->
                <div class="flex items-center gap-2">
                    <!-- Accent Color Picker -->
                    <div class="relative flex items-center justify-center w-7 h-7 rounded-full border border-gray-700 bg-gray-900 overflow-hidden cursor-pointer" title="포인트 색상 변경">
                        <input type="color" id="accentPicker" value="#6366f1" onchange="updateAccentColor(this.value)" class="absolute inset-0 w-12 h-12 -top-2 -left-2 cursor-pointer opacity-0">
                        <div id="pickerPreview" class="w-4 h-4 rounded-full bg-[#6366f1] pointer-events-none"></div>
                    </div>
                    
                    <!-- 추가 버튼 -->
                    <button onclick="openSearchModal()" class="w-8 h-8 rounded-full custom-card flex items-center justify-center hover:bg-[#282b37] transition text-gray-200">
                        <i class="fa-solid fa-plus text-xs"></i>
                    </button>
                </div>
            </div>

            <!-- 네비게이션 탭 (3대 메인 탭) -->
            <nav class="flex gap-6 overflow-x-auto no-scrollbar text-xs font-semibold border-b border-transparent">
                <button onclick="switchMainTab('profile')" id="nav-profile" class="pb-2 border-b-2 border-white text-white whitespace-nowrap transition">프로필</button>
                <button onclick="switchMainTab('watched')" id="nav-watched" class="pb-2 border-b-2 border-transparent text-gray-400 whitespace-nowrap transition">시청완료</button>
                <button onclick="switchMainTab('stats')" id="nav-stats" class="pb-2 border-b-2 border-transparent text-gray-400 whitespace-nowrap transition">평점</button>
            </nav>
        </header>

        <!-- 메인 콘텐츠 영역 -->
        <main class="p-4 flex-1">

            <!-- 1. 프로필 탭 화면 -->
            <div id="view-profile" class="space-y-6">
                <!-- 프로필 카드 -->
                <div class="custom-card rounded-2xl p-4 relative overflow-hidden bg-gradient-to-br from-[#1b1e2a] to-[#12141d]">
                    <div class="flex items-start justify-between">
                        <div class="flex gap-3 items-center">
                            <img id="user-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80" class="w-16 h-16 rounded-full object-cover border-2 border-gray-600 shadow-md">
                            <div>
                                <div class="flex items-center gap-2">
                                    <h2 id="user-name" class="font-bold text-base text-white">아카이버</h2>
                                    <button onclick="editProfilePrompt()" class="text-[10px] text-gray-400 hover:text-white"><i class="fa-solid fa-pen"></i></button>
                                </div>
                                <p id="user-bio" class="text-xs text-gray-400 mt-0.5">영화와 책을 나만의 시선으로 아카이빙합니다 🎬📚</p>
                                <span class="inline-block mt-2 px-2.5 py-0.5 rounded-full text-[10px] bg-indigo-500/20 accent-text font-semibold">Cinephile & Reader</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 수집 통계 요약 카드 -->
                <div class="grid grid-cols-3 gap-2">
                    <div class="custom-card p-3 rounded-xl flex flex-col items-center justify-center text-center">
                        <span class="text-xs text-gray-400">영화</span>
                        <span id="profile-movie-count" class="text-base font-bold text-white mt-0.5">0</span>
                    </div>
                    <div class="custom-card p-3 rounded-xl flex flex-col items-center justify-center text-center">
                        <span class="text-xs text-gray-400">드라마</span>
                        <span id="profile-tv-count" class="text-base font-bold text-white mt-0.5">0</span>
                    </div>
                    <div class="custom-card p-3 rounded-xl flex flex-col items-center justify-center text-center">
                        <span class="text-xs text-gray-400">책</span>
                        <span id="profile-book-count" class="text-base font-bold text-white mt-0.5">0</span>
                    </div>
                </div>

                <!-- 최근 기록 맛보기 피드 -->
                <div>
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="font-bold text-sm text-white flex items-center gap-1.5">
                            <i class="fa-solid fa-clock-rotate-left accent-text"></i> 최근 남긴 감상
                        </h3>
                        <button onclick="switchMainTab('watched')" class="text-xs text-gray-400 hover:text-white">전체보기 <i class="fa-solid fa-chevron-right text-[10px]"></i></button>
                    </div>
                    <div id="profile-recent-feed" class="space-y-3">
                        <!-- JS로 바인딩 -->
                    </div>
                </div>
            </div>

            <!-- 2. 시청완료 탭 화면 (Sub-tabs: 전체 / 영화 / 드라마 / 책) -->
            <div id="view-watched" class="hidden space-y-4">
                <!-- Sub Navigation Tabs -->
                <div class="flex justify-between items-center bg-[#171922] p-1 rounded-xl border border-[#282b37] text-xs">
                    <div class="flex gap-1 flex-1">
                        <button onclick="switchSubTab('all')" id="subnav-all" class="flex-1 py-1.5 rounded-lg font-medium text-center bg-[#282b37] text-white">전체</button>
                        <button onclick="switchSubTab('movie')" id="subnav-movie" class="flex-1 py-1.5 rounded-lg font-medium text-center text-gray-400">영화</button>
                        <button onclick="switchSubTab('tv')" id="subnav-tv" class="flex-1 py-1.5 rounded-lg font-medium text-center text-gray-400">드라마</button>
                        <button onclick="switchSubTab('book')" id="subnav-book" class="flex-1 py-1.5 rounded-lg font-medium text-center text-gray-400">책</button>
                    </div>
                </div>

                <!-- 도서 전용 View Switch Toggle (책 subtab 활성화시에만 표시) -->
                <div id="book-view-toggle-container" class="hidden justify-between items-center bg-[#12141c] px-3 py-2 rounded-lg border border-[#232633]">
                    <span class="text-xs font-semibold text-gray-300 flex items-center gap-1.5">
                        <i class="fa-solid fa-book-bookmark accent-text"></i> 책장 스타일
                    </span>
                    <div class="flex items-center bg-[#1c1f2b] p-0.5 rounded-lg border border-gray-700 text-[11px]">
                        <button onclick="setBookView('spine')" id="btn-view-spine" class="px-2.5 py-1 rounded-md text-white font-medium bg-gray-700 shadow">책등 보기</button>
                        <button onclick="setBookView('cover')" id="btn-view-cover" class="px-2.5 py-1 rounded-md text-gray-400 font-medium">표지 보기</button>
                    </div>
                </div>

                <!-- 수집 콘텐츠 표시 컨테이너 -->
                <div id="watched-list-container">
                    <!-- JS Rendering -->
                </div>
            </div>

            <!-- 3. 평점 통계 탭 화면 -->
            <div id="view-stats" class="hidden space-y-5">
                <!-- 평균 평점 요약 카드 -->
                <div class="custom-card p-4 rounded-2xl space-y-3 bg-gradient-to-br from-[#1a1d29] to-[#12141d]">
                    <div class="flex justify-between items-center border-b border-gray-800 pb-3">
                        <div>
                            <div class="text-xs text-gray-400">전체 기록 평균 평점</div>
                            <div class="flex items-baseline gap-1 mt-0.5">
                                <span id="stat-overall-avg" class="text-2xl font-black text-amber-400">0.0</span>
                                <span class="text-xs text-gray-500">/ 5.0</span>
                            </div>
                        </div>
                        <div class="text-right">
                            <span class="text-xs text-gray-400">총 감상 작품</span>
                            <div id="stat-total-count" class="text-base font-bold text-white">0개</div>
                        </div>
                    </div>

                    <!-- 카테고리별 평점 세부 -->
                    <div class="grid grid-cols-3 gap-2 text-center pt-1 text-xs">
                        <div class="bg-[#12141d] p-2 rounded-xl">
                            <span class="text-gray-400 block text-[10px]">🎬 영화</span>
                            <span id="stat-movie-avg" class="font-bold text-white mt-0.5 block">0.0</span>
                        </div>
                        <div class="bg-[#12141d] p-2 rounded-xl">
                            <span class="text-gray-400 block text-[10px]">📺 드라마</span>
                            <span id="stat-tv-avg" class="font-bold text-white mt-0.5 block">0.0</span>
                        </div>
                        <div class="bg-[#12141d] p-2 rounded-xl">
                            <span class="text-gray-400 block text-[10px]">📚 책</span>
                            <span id="stat-book-avg" class="font-bold text-white mt-0.5 block">0.0</span>
                        </div>
                    </div>
                </div>

                <!-- 점수 분포 그래프 -->
                <div class="custom-card p-4 rounded-2xl space-y-3">
                    <h3 class="font-bold text-sm text-white flex items-center justify-between">
                        <span>점수 분포 분석</span>
                        <span class="text-[10px] text-gray-400 font-normal">0.5 ~ 5.0 점</span>
                    </h3>
                    <div id="rating-distribution-bar" class="flex items-end justify-between h-28 pt-4 px-2 border-b border-gray-800 gap-1">
                        <!-- JS Dynamic Bar Render -->
                    </div>
                </div>

                <!-- 평점 그룹별 리스트 피드 -->
                <div class="space-y-4">
                    <h3 class="font-bold text-sm text-white">평점별 감상 피드</h3>
                    <div id="rating-grouped-feed" class="space-y-4">
                        <!-- JS Dynamic Feed Group Render -->
                    </div>
                </div>
            </div>

        </main>

        <!-- 라이브 통합 검색 및 추가 모달 -->
        <div id="search-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
            <div class="bg-[#171922] border border-[#282b37] w-full max-w-md rounded-t-2xl sm:rounded-2xl p-4 space-y-4 max-h-[85vh] flex flex-col shadow-2xl">
                <div class="flex justify-between items-center border-b border-gray-800 pb-3">
                    <div>
                        <h3 class="font-bold text-base text-white">실시간 미디어 검색</h3>
                        <p class="text-[11px] text-gray-400">TMDB(영화/TV) & Kakao(도서) 검색 연동</p>
                    </div>
                    <button onclick="closeSearchModal()" class="w-8 h-8 rounded-full bg-gray-800 text-gray-400 hover:text-white flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
                </div>

                <!-- 실시간 검색 입력 창 -->
                <div class="flex gap-2">
                    <input type="text" id="search-input" placeholder="검색어를 입력하세요 (예: 파묘, 미키17, 면세 미술)" 
                           onkeypress="if(event.key==='Enter') performLiveSearch()"
                           class="flex-1 bg-[#0e1015] border border-gray-800 rounded-xl px-3 py-2 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500">
                    <button onclick="performLiveSearch()" class="accent-bg px-4 py-2 rounded-xl text-xs font-semibold shadow hover:opacity-90">검색</button>
                </div>

                <!-- 실시간 검색 결과 리스트 -->
                <div id="search-results" class="flex-1 overflow-y-auto space-y-2.5 no-scrollbar pr-1 min-h-[280px]">
                    <div class="text-center text-gray-500 text-xs py-12 flex flex-col items-center justify-center gap-2">
                        <i class="fa-solid fa-magnifying-glass text-2xl opacity-40"></i>
                        <span>영화, 드라마, 도서 제목을 검색해 보세요.</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 감상 등록/수정 모달 -->
        <div id="review-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
            <div class="bg-[#171922] border border-[#282b37] w-full max-w-sm rounded-2xl p-4 space-y-4 shadow-2xl">
                <div class="flex justify-between items-center border-b border-gray-800 pb-2">
                    <h3 id="review-modal-title" class="font-bold text-sm text-white">감상 기록하기</h3>
                    <button onclick="closeReviewModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                </div>

                <div class="flex gap-3 items-center bg-[#0e1015] p-2 rounded-xl border border-gray-800">
                    <img id="modal-item-poster" src="" class="w-12 h-16 object-cover rounded-lg">
                    <div class="flex-1 min-w-0">
                        <div id="modal-item-title" class="font-bold text-xs text-white truncate">제목</div>
                        <div id="modal-item-sub" class="text-[10px] text-gray-400 truncate">정보</div>
                    </div>
                </div>

                <!-- 별점 선택기 -->
                <div class="space-y-1">
                    <div class="flex justify-between text-xs">
                        <span class="text-gray-400">평점 선택</span>
                        <span id="star-rating-val" class="font-bold text-amber-400">★ 5.0</span>
                    </div>
                    <input type="range" id="rating-range" min="0.5" max="5.0" step="0.5" value="5.0" oninput="updateRatingDisplay(this.value)" class="w-full accent-amber-400 cursor-pointer">
                </div>

                <!-- 관람/독서 일자 -->
                <div class="space-y-1">
                    <label class="text-xs text-gray-400 block">날짜</label>
                    <input type="date" id="review-date" class="w-full bg-[#0e1015] border border-gray-800 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none">
                </div>

                <!-- 한 줄 감상평 -->
                <div class="space-y-1">
                    <label class="text-xs text-gray-400 block">감상평</label>
                    <textarea id="review-comment" rows="3" placeholder="작품에 대한 생각이나 한 줄 감상을 적어주세요." class="w-full bg-[#0e1015] border border-gray-800 rounded-xl p-2.5 text-xs text-white placeholder-gray-600 focus:outline-none resize-none"></textarea>
                </div>

                <div class="flex gap-2 pt-2">
                    <button onclick="closeReviewModal()" class="flex-1 py-2 bg-gray-800 text-gray-300 rounded-xl text-xs font-medium hover:bg-gray-700">취소</button>
                    <button onclick="saveReviewSubmit()" class="flex-1 py-2 accent-bg rounded-xl text-xs font-semibold shadow">저장하기</button>
                </div>
            </div>
        </div>

        <!-- 하단 고정 네비게이션 바 -->
        <footer class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-[#0e1015]/95 border-t border-[#282b37] px-8 py-2 flex justify-between items-center text-xs z-20">
            <button onclick="switchMainTab('profile')" class="flex flex-col items-center gap-1 text-gray-400 hover:text-white transition">
                <i class="fa-solid fa-house text-base"></i>
                <span class="text-[10px]">피드</span>
            </button>
            <button onclick="openSearchModal()" class="w-10 h-10 rounded-full accent-bg flex items-center justify-center text-white -mt-4 shadow-lg border-2 border-[#0e1015] hover:scale-105 transition">
                <i class="fa-solid fa-plus text-base"></i>
            </button>
            <button onclick="switchMainTab('stats')" class="flex flex-col items-center gap-1 text-gray-400 hover:text-white transition">
                <i class="fa-solid fa-chart-pie text-base"></i>
                <span class="text-[10px]">평점분석</span>
            </button>
        </footer>

    </div>

    <!-- Application Logic & Scripts -->
    <script>
        // 발급받으신 API 인증 키 세팅
        const TMDB_BEARER_TOKEN = "eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiIwYjA5MGEzYmIxZmRkYWM2MzZlNDI0YmRjNTVjNmI2MiIsIm5iZiI6MTc5NDM3NTQ0Ny4zNDYsInN1YiI6IjZhZjNmZjE3MjY5MmI2ZjRjMWQzOTFlZSIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.tHiA32lj9x1lcU95eDEgjMCEI5j8Q2SHlbpIWv_NBks";
        const KAKAO_REST_KEY = "488cb5471dfa88c4133dd98d4958ab92";

        // 애플리케이션 기본 데이터 상태
        let currentMainTab = 'profile';
        let currentSubTab = 'all';
        let bookViewMode = 'spine'; // 'spine' or 'cover'
        let pendingItem = null; // 감상 등록 중인 아이템 객체

        // LocalStorage 연동 데이터베이스
        let archiveData = JSON.parse(localStorage.getItem('repov_archive_data')) || [
            { id: 101, type: 'movie', title: '미키 17', poster: 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=300&auto=format&fit=crop&q=80', date: '2026-11-04', rating: 4.8, comment: '봉준호 감독 특유의 위트와 상상력이 압도적이었음.', info: '2026 · 영화' },
            { id: 102, type: 'book', title: '면세 미술', poster: 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=300&auto=format&fit=crop&q=80', date: '2026-11-08', rating: 5.0, comment: '지구 내전 시대의 미술에 관한 탁월한 통찰력.', info: '히토 슈타이얼 · 도서', spineColor: '#3a5a40' },
            { id: 103, type: 'tv', title: '오징어 게임 시즌2', poster: 'https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?w=300&auto=format&fit=crop&q=80', date: '2026-11-10', rating: 4.2, comment: '몰입감이 높아 밤새워 정주행함.', info: '2024 · 드라마' }
        ];

        let userProfile = JSON.parse(localStorage.getItem('repov_user_profile')) || {
            name: '아카이버',
            bio: '영화와 책을 나만의 시선으로 아카이빙합니다 🎬📚',
            avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80'
        };

        // 스마트 콘트라스트 보정 및 accent 색상 변경
        function updateAccentColor(colorHex) {
            document.documentElement.style.setProperty('--accent-color', colorHex);
            document.getElementById('pickerPreview').style.backgroundColor = colorHex;

            // Relative Luminance 계산 (W3C 표준 스마트 대비 로직)
            const rgb = hexToRgb(colorHex);
            if (rgb) {
                const luminance = (0.299 * rgb.r + 0.587 * rgb.g + 0.114 * rgb.b) / 255;
                const textColor = luminance > 0.6 ? '#000000' : '#ffffff';
                document.documentElement.style.setProperty('--accent-text', textColor);
            }
            localStorage.setItem('repov_accent_color', colorHex);
        }

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : null;
        }

        // 메인 탭 전환
        function switchMainTab(tabName) {
            currentMainTab = tabName;
            ['profile', 'watched', 'stats'].forEach(t => {
                document.getElementById(`view-${t}`).classList.add('hidden');
                const btn = document.getElementById(`nav-${t}`);
                btn.classList.replace('text-white', 'text-gray-400');
                btn.classList.replace('border-white', 'border-transparent');
            });

            document.getElementById(`view-${tabName}`).classList.remove('hidden');
            const activeBtn = document.getElementById(`nav-${tabName}`);
            activeBtn.classList.replace('text-gray-400', 'text-white');
            activeBtn.classList.replace('border-transparent', 'border-white');

            if (tabName === 'profile') renderProfileFeed();
            if (tabName === 'watched') renderWatchedList();
            if (tabName === 'stats') renderStatsDashboard();
        }

        // 시청완료 서브 탭 전환
        function switchSubTab(subType) {
            currentSubTab = subType;
            ['all', 'movie', 'tv', 'book'].forEach(st => {
                const btn = document.getElementById(`subnav-${st}`);
                btn.className = "flex-1 py-1.5 rounded-lg font-medium text-center text-gray-400";
            });

            const activeSubBtn = document.getElementById(`subnav-${subType}`);
            activeSubBtn.className = "flex-1 py-1.5 rounded-lg font-medium text-center bg-[#282b37] text-white shadow";

            // 도서 전용 보기 토글 표시 여부
            const toggleBox = document.getElementById('book-view-toggle-container');
            if (subType === 'book') {
                toggleBox.classList.remove('hidden');
                toggleBox.classList.add('flex');
            } else {
                toggleBox.classList.add('hidden');
                toggleBox.classList.remove('flex');
            }

            renderWatchedList();
        }

        // 도서 책장 보기 방식 변경 (책등 vs 표지)
        function setBookView(mode) {
            bookViewMode = mode;
            const btnSpine = document.getElementById('btn-view-spine');
            const btnCover = document.getElementById('btn-view-cover');

            if (mode === 'spine') {
                btnSpine.className = "px-2.5 py-1 rounded-md text-white font-medium bg-gray-700 shadow";
                btnCover.className = "px-2.5 py-1 rounded-md text-gray-400 font-medium";
            } else {
                btnCover.className = "px-2.5 py-1 rounded-md text-white font-medium bg-gray-700 shadow";
                btnSpine.className = "px-2.5 py-1 rounded-md text-gray-400 font-medium";
            }
            renderWatchedList();
        }

        // 프로필 뷰 랜더링
        function renderProfileFeed() {
            document.getElementById('user-name').innerText = userProfile.name;
            document.getElementById('user-bio').innerText = userProfile.bio;
            document.getElementById('user-avatar').src = userProfile.avatar;

            const movies = archiveData.filter(d => d.type === 'movie');
            const tvs = archiveData.filter(d => d.type === 'tv');
            const books = archiveData.filter(d => d.type === 'book');

            document.getElementById('profile-movie-count').innerText = `${movies.length}편`;
            document.getElementById('profile-tv-count').innerText = `${tvs.length}편`;
            document.getElementById('profile-book-count').innerText = `${books.length}권`;

            const recentContainer = document.getElementById('profile-recent-feed');
            const recentItems = [...archiveData].reverse().slice(0, 3);

            if (recentItems.length === 0) {
                recentContainer.innerHTML = `<div class="text-center text-gray-500 py-6 text-xs">아직 등록된 기록이 없습니다.</div>`;
                return;
            }

            recentContainer.innerHTML = recentItems.map(item => `
                <div class="custom-card p-3 rounded-xl flex gap-3 items-center">
                    <img src="${item.poster}" class="w-12 h-16 object-cover rounded-lg shadow">
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between items-start">
                            <span class="font-bold text-xs text-white truncate">${item.title}</span>
                            <span class="text-amber-400 text-xs font-semibold">★ ${item.rating.toFixed(1)}</span>
                        </div>
                        <p class="text-[11px] text-gray-400 mt-1 line-clamp-2">${item.comment || '남긴 기록이 없습니다.'}</p>
                        <span class="text-[10px] text-gray-500 mt-1 block">${item.date} 감상</span>
                    </div>
                </div>
            `).join('');
        }

        // 시청완료 메인 목로 랜더링 (책등 View 및 표지 Grid 지원)
        function renderWatchedList() {
            const container = document.getElementById('watched-list-container');
            let filtered = archiveData;

            if (currentSubTab !== 'all') {
                filtered = archiveData.filter(d => d.type === currentSubTab);
            }

            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center text-gray-500 py-12 text-xs">해당하는 감상 기록이 없습니다.</div>`;
                return;
            }

            // 책 탭이면서 책등 보기(spine) 모드일 경우
            if (currentSubTab === 'book' && bookViewMode === 'spine') {
                const spineColors = ['#2b3a4a', '#4a2b2b', '#2b4a3a', '#4a422b', '#3b2b4a', '#2b454a', '#543d2b'];
                
                container.innerHTML = `
                    <div class="space-y-6 pt-2">
                        <div class="bg-[#12141c] p-4 pb-0 rounded-2xl border border-[#232633] shadow-inner">
                            <div class="flex items-end justify-start gap-2 overflow-x-auto no-scrollbar pb-1 min-h-[220px]">
                                ${filtered.map((book, idx) => {
                                    const bgColor = book.spineColor || spineColors[idx % spineColors.length];
                                    return `
                                        <div onclick="openItemDetail(${book.id})" class="book-spine shrink-0 w-11 h-48 rounded-t-md p-2 flex flex-col justify-between items-center text-white cursor-pointer relative" style="background-color: ${bgColor}">
                                            <div class="text-[9px] bg-black/40 px-1 py-0.5 rounded text-amber-300 font-bold">${book.rating.toFixed(1)}</div>
                                            <div class="text-xs font-bold tracking-wider my-auto line-clamp-1 truncate">${book.title}</div>
                                            <div class="w-1.5 h-1.5 rounded-full bg-amber-400 mb-1"></div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                            <!-- 나무 책장 받침대 스타일 -->
                            <div class="shelf-divider -mx-4"></div>
                        </div>
                    </div>
                `;
                return;
            }

            // 일반 표지 그리드 및 카드 피드 형태
            container.innerHTML = `
                <div class="grid grid-cols-3 gap-3">
                    ${filtered.map(item => `
                        <div onclick="openItemDetail(${item.id})" class="space-y-1 cursor-pointer group">
                            <div class="w-full aspect-poster rounded-xl custom-card overflow-hidden relative shadow-md group-hover:scale-105 transition">
                                <img src="${item.poster}" class="w-full h-full object-cover">
                                <div class="absolute top-1 right-1 bg-black/70 backdrop-blur-xs px-1.5 py-0.5 rounded-md text-amber-400 text-[10px] font-bold">
                                    ★ ${item.rating.toFixed(1)}
                                </div>
                            </div>
                            <div class="font-semibold text-xs text-white truncate">${item.title}</div>
                            <div class="text-[10px] text-gray-500 truncate">${item.date}</div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // 평점 및 통계 분석 랜더링
        function renderStatsDashboard() {
            if (archiveData.length === 0) return;

            const totalCount = archiveData.length;
            const overallAvg = (archiveData.reduce((acc, cur) => acc + cur.rating, 0) / totalCount).toFixed(1);

            document.getElementById('stat-overall-avg').innerText = overallAvg;
            document.getElementById('stat-total-count').innerText = `${totalCount}개`;

            const calcAvg = (type) => {
                const items = archiveData.filter(d => d.type === type);
                if (items.length === 0) return '0.0';
                return (items.reduce((acc, cur) => acc + cur.rating, 0) / items.length).toFixed(1);
            };

            document.getElementById('stat-movie-avg').innerText = `${calcAvg('movie')}점`;
            document.getElementById('stat-tv-avg').innerText = `${calcAvg('tv')}점`;
            document.getElementById('stat-book-avg').innerText = `${calcAvg('book')}점`;

            // 점수 분포 분포도 계산 (0.5 ~ 5.0)
            const scores = [0.5, 1.0, 1.5, 2.0, 2.5, 3.0, 3.5, 4.0, 4.5, 5.0];
            const distMap = {};
            scores.forEach(s => distMap[s] = 0);

            archiveData.forEach(d => {
                const rounded = Math.round(d.rating * 2) / 2;
                if (distMap[rounded] !== undefined) distMap[rounded]++;
            });

            const maxFreq = Math.max(...Object.values(distMap), 1);
            const barContainer = document.getElementById('rating-distribution-bar');

            barContainer.innerHTML = scores.map(score => {
                const count = distMap[score];
                const heightPercent = (count / maxFreq) * 100;
                return `
                    <div class="flex flex-col items-center flex-1 h-full justify-end gap-1">
                        <span class="text-[9px] text-gray-400 font-bold">${count > 0 ? count : ''}</span>
                        <div class="w-full bg-indigo-500/30 rounded-t-sm relative flex items-end overflow-hidden" style="height: ${Math.max(heightPercent, 5)}%">
                            <div class="w-full accent-bg rounded-t-sm" style="height: 100%"></div>
                        </div>
                        <span class="text-[9px] text-gray-500">${score}</span>
                    </div>
                `;
            }).join('');

            // 평점별 그룹 피드 랜더링
            const groupContainer = document.getElementById('rating-grouped-feed');
            const grouped = {};

            archiveData.forEach(item => {
                const key = item.rating.toFixed(1);
                if (!grouped[key]) grouped[key] = [];
                grouped[key].push(item);
            });

            const sortedKeys = Object.keys(grouped).sort((a, b) => b - a);

            groupContainer.innerHTML = sortedKeys.map(key => `
                <div class="space-y-2">
                    <div class="text-xs font-bold text-amber-400 flex items-center gap-1 border-b border-gray-800 pb-1">
                        <span>★ ${key}점 라인업</span>
                        <span class="text-[10px] text-gray-500 font-normal">(${grouped[key].length}개)</span>
                    </div>
                    <div class="space-y-2">
                        ${grouped[key].map(item => `
                            <div class="custom-card p-2.5 rounded-xl flex gap-3 items-center">
                                <img src="${item.poster}" class="w-10 h-14 object-cover rounded-lg">
                                <div class="flex-1 min-w-0">
                                    <div class="font-bold text-xs text-white truncate">${item.title}</div>
                                    <div class="text-[10px] text-gray-400 mt-0.5 line-clamp-1">${item.comment || '남긴 감상이 없습니다.'}</div>
                                    <div class="text-[9px] text-gray-500 mt-1">${item.info || ''} · ${item.date}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        // TMDB & Kakao 라이브 API 연동 검색
        async function performLiveSearch() {
            const query = document.getElementById('search-input').value.trim();
            const resultsContainer = document.getElementById('search-results');

            if (!query) return;

            resultsContainer.innerHTML = `<div class="text-center text-gray-400 py-10 text-xs"><i class="fa-solid fa-spinner fa-spin text-lg block mb-2"></i>검색 중...</div>`;

            try {
                // 1. TMDB Multi Search (영화/TV)
                const tmdbPromise = fetch(`https://api.themoviedb.org/3/search/multi?query=${encodeURIComponent(query)}&language=ko-KR&page=1`, {
                    headers: { Authorization: `Bearer ${TMDB_BEARER_TOKEN}` }
                }).then(res => res.json()).catch(() => ({ results: [] }));

                // 2. Kakao Book Search (도서)
                const kakaoPromise = fetch(`https://dapi.kakao.com/v3/search/book?query=${encodeURIComponent(query)}`, {
                    headers: { Authorization: `KakaoAK ${KAKAO_REST_KEY}` }
                }).then(res => res.json()).catch(() => ({ documents: [] }));

                const [tmdbRes, kakaoRes] = await Promise.all([tmdbPromise, kakaoPromise]);

                let items = [];

                // TMDB 결과 파싱
                if (tmdbRes.results) {
                    tmdbRes.results.forEach(m => {
                        if (m.media_type === 'movie' || m.media_type === 'tv') {
                            const poster = m.poster_path ? `https://image.tmdb.org/t/p/w300${m.poster_path}` : 'https://via.placeholder.com/150x225?text=No+Cover';
                            const title = m.title || m.name;
                            const year = (m.release_date || m.first_air_date || '').split('-')[0];
                            items.push({
                                type: m.media_type,
                                title: title,
                                poster: poster,
                                info: `${year ? year + ' · ' : ''}${m.media_type === 'movie' ? '영화' : '드라마'}`
                            });
                        }
                    });
                }

                // Kakao 결과 파싱
                if (kakaoRes.documents) {
                    kakaoRes.documents.forEach(b => {
                        const poster = b.thumbnail || 'https://via.placeholder.com/150x225?text=No+Cover';
                        items.push({
                            type: 'book',
                            title: b.title,
                            poster: poster,
                            info: `${b.authors ? b.authors.join(', ') : '저자 미상'} · 도서`
                        });
                    });
                }

                if (items.length === 0) {
                    resultsContainer.innerHTML = `<div class="text-center text-gray-500 py-10 text-xs">검색 결과가 없습니다.</div>`;
                    return;
                }

                resultsContainer.innerHTML = items.map((item, idx) => `
                    <div class="custom-card p-2 rounded-xl flex gap-3 items-center">
                        <img src="${item.poster}" class="w-12 h-16 object-cover rounded-lg shadow">
                        <div class="flex-1 min-w-0">
                            <div class="font-bold text-xs text-white truncate">${item.title}</div>
                            <div class="text-[10px] text-gray-400 mt-0.5 truncate">${item.info}</div>
                            <button onclick='openReviewModalFromSearch(${JSON.stringify(item).replace(/'/g, "&apos;")})' class="mt-2 accent-bg px-3 py-1 rounded-lg text-[10px] font-semibold">
                                + 감상 기록
                            </button>
                        </div>
                    </div>
                `).join('');

            } catch (err) {
                resultsContainer.innerHTML = `<div class="text-center text-red-400 py-10 text-xs">검색 중 오류가 발생했습니다.</div>`;
            }
        }

        // 검색 모달 컨트롤
        function openSearchModal() { document.getElementById('search-modal').classList.remove('hidden'); }
        function closeSearchModal() { document.getElementById('search-modal').classList.add('hidden'); }

        // 감상 모달 컨트롤
        function openReviewModalFromSearch(item) {
            pendingItem = item;
            document.getElementById('modal-item-poster').src = item.poster;
            document.getElementById('modal-item-title').innerText = item.title;
            document.getElementById('modal-item-sub').innerText = item.info;
            document.getElementById('review-date').value = new Date().toISOString().split('T')[0];
            document.getElementById('review-comment').value = '';
            document.getElementById('rating-range').value = 5.0;
            updateRatingDisplay(5.0);

            closeSearchModal();
            document.getElementById('review-modal').classList.remove('hidden');
        }

        function closeReviewModal() {
            document.getElementById('review-modal').classList.add('hidden');
        }

        function updateRatingDisplay(val) {
            document.getElementById('star-rating-val').innerText = `★ ${parseFloat(val).toFixed(1)}`;
        }

        function saveReviewSubmit() {
            if (!pendingItem) return;

            const ratingVal = parseFloat(document.getElementById('rating-range').value);
            const dateVal = document.getElementById('review-date').value || new Date().toISOString().split('T')[0];
            const commentVal = document.getElementById('review-comment').value.trim();

            const newItem = {
                id: Date.now(),
                type: pendingItem.type,
                title: pendingItem.title,
                poster: pendingItem.poster,
                info: pendingItem.info,
                rating: ratingVal,
                date: dateVal,
                comment: commentVal
            };

            archiveData.push(newItem);
            localStorage.setItem('repov_archive_data', JSON.stringify(archiveData));

            closeReviewModal();
            alert(`'${newItem.title}' 감상이 아카이브에 기록되었습니다!`);

            if (currentMainTab === 'profile') renderProfileFeed();
            if (currentMainTab === 'watched') renderWatchedList();
            if (currentMainTab === 'stats') renderStatsDashboard();
        }

        function editProfilePrompt() {
            const name = prompt("프로필 이름을 입력하세요:", userProfile.name);
            if (name) {
                userProfile.name = name;
                localStorage.setItem('repov_user_profile', JSON.stringify(userProfile));
                renderProfileFeed();
            }
        }

        // 초기화
        window.onload = function() {
            const savedAccent = localStorage.getItem('repov_accent_color');
            if (savedAccent) {
                document.getElementById('accentPicker').value = savedAccent;
                updateAccentColor(savedAccent);
            }
            renderProfileFeed();
        };
    </script>
</body>
