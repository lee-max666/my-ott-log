<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY LOG</title>
    
    <!-- 링크 공유 시 깔끔하게 뜨도록 설정한 메타 태그 -->
    <meta property="og:title" content="MY LOG">
    <meta property="og:description" content="나만의 영화, 드라마, 책 아카이브 공간입니다.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://lee-max666.github.io/my-ott-log/">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Nanum+Gothic:wght@400;700&family=Gowun+Dodum&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        accent: 'var(--accent-color, #8b5cf6)',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(150, 150, 150, 0.2); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(150, 150, 150, 0.4); }
        .spine-item { writing-mode: vertical-rl; text-orientation: mixed; }
        .pc-viewport-wrapper { min-width: 1100px; }
    </style>
</head>
<body class="bg-white text-zinc-900 dark:bg-zinc-950 dark:text-zinc-100 min-h-screen selection:bg-accent selection:text-white transition-colors duration-200 overflow-x-auto" id="bodyFontContainer">

    <div class="pc-viewport-wrapper">
        <!-- 상단 네비게이션 바 -->
        <header class="sticky top-0 z-50 bg-white/80 dark:bg-zinc-950/80 backdrop-blur-md border-b border-zinc-200 dark:border-zinc-800/60">
            <div class="max-w-6xl mx-auto px-6 h-20 flex items-center justify-between">
                <div class="flex items-center gap-10">
                    <h1 class="text-2xl font-bold tracking-tight text-zinc-900 dark:text-white cursor-pointer" onclick="switchTab('calendar')">MY LOG</h1>
                    <nav class="flex gap-2">
                        <button onclick="switchTab('calendar')" id="nav-calendar" class="px-5 py-2.5 text-base font-medium rounded-xl transition-colors text-accent bg-accent/10">캘린더</button>
                        <button onclick="switchTab('completed')" id="nav-completed" class="px-5 py-2.5 text-base font-medium rounded-xl transition-colors text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-white hover:bg-zinc-100 dark:hover:bg-zinc-900">시청완료</button>
                        <button onclick="switchTab('ratings')" id="nav-ratings" class="px-5 py-2.5 text-base font-medium rounded-xl transition-colors text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-white hover:bg-zinc-100 dark:hover:bg-zinc-900">평점</button>
                        <button onclick="switchTab('profile')" id="nav-profile" class="px-5 py-2.5 text-base font-medium rounded-xl transition-colors text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-white hover:bg-zinc-100 dark:hover:bg-zinc-900">프로필</button>
                    </nav>
                </div>
                
                <div class="flex items-center gap-4">
                    <select id="fontSelector" onchange="changeFontFamily(this.value)" class="bg-zinc-100 dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-xl px-3 py-2 text-sm text-zinc-700 dark:text-zinc-300 focus:outline-none">
                        <option value="Noto Sans KR">기본 (Noto Sans)</option>
                        <option value="Nanum Gothic">나눔고딕</option>
                        <option value="Gowun Dodum">고운돋움</option>
                        <option value="Poppins">Poppins (영문강조)</option>
                    </select>

                    <div class="flex items-center gap-3 bg-zinc-100 dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-full px-4 py-2">
                        <input type="color" id="accentColorPicker" value="#8b5cf6" class="w-6 h-6 rounded-full border-0 cursor-pointer bg-transparent" onchange="changeAccentColor(this.value)" title="포인트 컬러 선택">
                        <button onclick="toggleDarkMode()" class="text-zinc-600 dark:text-zinc-300 hover:text-zinc-900 dark:hover:text-white transition-colors text-base" id="themeToggleBtn">☀️</button>
                    </div>
                    <button onclick="openAddModal()" class="bg-accent text-white px-5 py-2.5 rounded-xl text-base font-medium flex items-center gap-2 shadow-lg shadow-accent/20 hover:opacity-90 transition-opacity">
                        <span>+ 기록하기</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- 메인 컨테이너 -->
        <main class="max-w-6xl mx-auto px-6 py-10">

            <!-- 1. 캘린더 탭 -->
            <section id="tab-calendar" class="space-y-8">
                <div class="bg-white dark:bg-zinc-900/60 border border-zinc-200 dark:border-zinc-800/80 rounded-3xl p-8 flex items-center justify-between gap-6 shadow-sm">
                    <div class="flex items-center gap-6">
                        <img id="user-avatar-img" src="https://github.com/lee-max666/mars.github.io/blob/main/%E2%98%85.jpg?raw=true" alt="Avatar" class="w-20 h-20 rounded-full object-cover border-4 border-accent shadow-md">
                        <div>
                            <div class="flex items-center gap-3">
                                <h2 id="user-name-display" class="text-xl font-bold text-zinc-900 dark:text-white">아카이버</h2>
                                <button onclick="switchTab('profile')" class="text-sm text-zinc-500 hover:text-accent font-medium">✏️ 수정</button>
                            </div>
                            <p id="user-bio-display" class="text-base text-zinc-600 dark:text-zinc-400 mt-1">영화와 책을 나만의 시선으로 아카이빙합니다 🎬 📚</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-4">
                        <div class="bg-zinc-50 dark:bg-zinc-950/60 border border-zinc-200 dark:border-zinc-800/60 rounded-2xl px-6 py-4 text-center min-w-[100px]">
                            <span class="block text-sm text-zinc-500">영화</span>
                            <span class="text-xl font-bold text-zinc-900 dark:text-white" id="stat-movie-count">0편</span>
                        </div>
                        <div class="bg-zinc-50 dark:bg-zinc-950/60 border border-zinc-200 dark:border-zinc-800/60 rounded-2xl px-6 py-4 text-center min-w-[100px]">
                            <span class="block text-sm text-zinc-500">드라마</span>
                            <span class="text-xl font-bold text-zinc-900 dark:text-white" id="stat-drama-count">0편</span>
                        </div>
                        <div class="bg-zinc-50 dark:bg-zinc-950/60 border border-zinc-200 dark:border-zinc-800/60 rounded-2xl px-6 py-4 text-center min-w-[100px]">
                            <span class="block text-sm text-zinc-500">책</span>
                            <span class="text-xl font-bold text-zinc-900 dark:text-white" id="stat-book-count">0권</span>
                        </div>
                    </div>
                </div>

                <div class="bg-white dark:bg-zinc-900/40 border border-zinc-200 dark:border-zinc-800/80 rounded-3xl p-8 shadow-sm">
                    <div class="flex items-center justify-between mb-8">
                        <h3 id="calendar-month-title" class="text-2xl font-bold text-zinc-900 dark:text-white">2026.11</h3>
                        <div class="flex items-center gap-3">
                            <button onclick="changeMonth(-1)" class="p-3 bg-zinc-100 dark:bg-zinc-800 hover:bg-zinc-200 dark:hover:bg-zinc-700 rounded-xl text-base font-bold">&lt;</button>
                            <button onclick="changeMonth(1)" class="p-3 bg-zinc-100 dark:bg-zinc-800 hover:bg-zinc-200 dark:hover:bg-zinc-700 rounded-xl text-base font-bold">&gt;</button>
                        </div>
                    </div>
                    <div class="grid grid-cols-7 gap-3 text-center text-sm font-bold text-zinc-400 mb-3">
                        <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
                    </div>
                    <div id="calendar-grid" class="grid grid-cols-7 gap-3"></div>
                </div>
            </section>

            <!-- 2. 시청완료 탭 -->
            <section id="tab-completed" class="hidden space-y-8">
                <div class="flex items-center justify-between border-b border-zinc-200 dark:border-zinc-800 pb-6">
                    <div class="flex gap-3">
                        <button onclick="switchSubTab('movie')" id="sub-nav-movie" class="px-5 py-2.5 rounded-2xl text-base font-medium bg-accent text-white">영화</button>
                        <button onclick="switchSubTab('drama')" id="sub-nav-drama" class="px-5 py-2.5 rounded-2xl text-base font-medium bg-zinc-100 dark:bg-zinc-900 text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-white">드라마</button>
                        <button onclick="switchSubTab('book')" id="sub-nav-book" class="px-5 py-2.5 rounded-2xl text-base font-medium bg-zinc-100 dark:bg-zinc-900 text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-white">책</button>
                    </div>
                    <div id="book-view-toggle-container" class="hidden flex items-center gap-1.5 bg-zinc-100 dark:bg-zinc-900 p-1.5 rounded-2xl border border-zinc-200 dark:border-zinc-800">
                        <button onclick="setBookView('spine')" id="btn-view-spine" class="px-4 py-2 text-sm font-medium rounded-xl bg-accent text-white transition-all">책장 보기</button>
                        <button onclick="setBookView('cover')" id="btn-view-cover" class="px-4 py-2 text-sm font-medium rounded-xl text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-white transition-all">표지 보기</button>
                    </div>
                </div>
                <div id="completed-items-container"></div>
            </section>

            <!-- 3. 평점 분석 탭 -->
            <section id="tab-ratings" class="hidden space-y-8">
                <div>
                    <h3 class="text-2xl font-bold text-zinc-900 dark:text-white">점수 분석</h3>
                </div>
                <div class="grid grid-cols-3 gap-6">
                    <div class="bg-white dark:bg-zinc-900/60 border border-zinc-200 dark:border-zinc-800 rounded-3xl p-6 shadow-sm">
                        <span class="text-sm text-zinc-500 font-medium">전체 평균 평점</span>
                        <div class="text-4xl font-black text-zinc-900 dark:text-white mt-3 flex items-center gap-3">
                            ⭐ <span id="avg-score-all">0.0</span> <span class="text-lg font-normal text-zinc-400">/ 5.0</span>
                        </div>
                    </div>
                    <div class="bg-white dark:bg-zinc-900/60 border border-zinc-200 dark:border-zinc-800 rounded-3xl p-6 shadow-sm">
                        <span class="text-sm text-zinc-500 font-medium">총 기록된 작품 수</span>
                        <div class="text-4xl font-black text-zinc-900 dark:text-white mt-3">
                            📚 <span id="total-recorded-count">0</span>개
                        </div>
                    </div>
                    <div class="bg-white dark:bg-zinc-900/60 border border-zinc-200 dark:border-zinc-800 rounded-3xl p-6 shadow-sm">
                        <span class="text-sm text-zinc-500 font-medium">최고 평점 작품</span>
                        <div class="text-xl font-bold text-zinc-900 dark:text-white mt-3 truncate" id="top-rated-title">-</div>
                    </div>
                </div>
                
                <div class="bg-white dark:bg-zinc-900/40 border border-zinc-200 dark:border-zinc-800/80 rounded-3xl p-8 shadow-sm">
                    <h4 class="text-lg font-bold text-zinc-900 dark:text-white mb-6">점수 분석</h4>
                    <div class="grid grid-cols-10 gap-3 items-end h-56 pt-8 pb-4 px-4 border-b border-zinc-200 dark:border-zinc-800" id="score-distribution-bars"></div>
                    <div class="flex justify-between text-sm font-medium text-zinc-400 mt-4 px-2">
                        <span>1점대</span><span>2점대</span><span>3점대</span><span>4점대</span><span>5점만점</span>
                    </div>
                </div>

                <div class="space-y-4 pt-4">
                    <h4 class="text-xl font-bold text-zinc-900 dark:text-white">⭐ 평점 높은 순 작품 목록</h4>
                    <div id="ratings-sorted-container" class="space-y-4"></div>
                </div>
            </section>

            <!-- 4. 프로필 탭 -->
            <section id="tab-profile" class="hidden space-y-8 max-w-2xl mx-auto">
                <div class="bg-white dark:bg-zinc-900/60 border border-zinc-200 dark:border-zinc-800/80 rounded-3xl p-8 shadow-sm space-y-6">
                    <div class="flex items-center gap-6">
                        <img id="profile-tab-avatar" src="https://github.com/lee-max666/mars.github.io/blob/main/%E2%98%85.jpg?raw=true" alt="Avatar" class="w-24 h-24 rounded-full object-cover border-4 border-accent shadow-lg">
                        <div class="flex-1">
                            <h2 id="profile-tab-name" class="text-2xl font-bold text-zinc-900 dark:text-white">아카이버</h2>
                            <p id="profile-tab-bio" class="text-base text-zinc-600 dark:text-zinc-400 mt-1">영화와 책을 나만의 시선으로 아카이빙합니다 🎬 📚</p>
                        </div>
                    </div>

                    <div class="pt-6 border-t border-zinc-200 dark:border-zinc-800 space-y-4">
                        <h3 class="text-lg font-bold text-zinc-900 dark:text-white">프로필 정보 수정</h3>
                        <div>
                            <label class="block text-sm font-medium text-zinc-500 mb-2">기본 프로필 캐릭터 선택</label>
                            <div class="flex gap-4">
                                <img src="https://github.com/lee-max666/mars.github.io/blob/main/%E2%98%85.jpg?raw=true" onclick="selectPresetAvatar('https://github.com/lee-max666/mars.github.io/blob/main/%E2%98%85.jpg?raw=true')" class="w-14 h-14 rounded-full object-cover cursor-pointer border-2 border-transparent hover:border-accent shadow-sm">
                                <img src="https://github.com/lee-max666/mars.github.io/blob/main/%E2%98%85%20(2).jpg?raw=true" onclick="selectPresetAvatar('https://github.com/lee-max666/mars.github.io/blob/main/%E2%98%85%20(2).jpg?raw=true')" class="w-14 h-14 rounded-full object-cover cursor-pointer border-2 border-transparent hover:border-accent shadow-sm">
                                <img src="https://github.com/lee-max666/mars.github.io/blob/main/%E2%98%85%20(1).jpg?raw=true" onclick="selectPresetAvatar('https://github.com/lee-max666/mars.github.io/blob/main/%E2%98%85%20(1).jpg?raw=true')" class="w-14 h-14 rounded-full object-cover cursor-pointer border-2 border-transparent hover:border-accent shadow-sm">
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-zinc-500 mb-1">닉네임</label>
                            <input type="text" id="input-profile-name" class="w-full bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 rounded-xl px-4 py-2.5 text-base text-zinc-900 dark:text-white focus:outline-none focus:border-accent">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-zinc-500 mb-1">소개글</label>
                            <input type="text" id="input-profile-bio" class="w-full bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 rounded-xl px-4 py-2.5 text-base text-zinc-900 dark:text-white focus:outline-none focus:border-accent">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-zinc-500 mb-1">프로필 이미지 직접 업로드 또는 URL</label>
                            <div class="flex gap-3">
                                <input type="text" id="input-profile-img" placeholder="이미지 주소 입력 또는 파일 업로드" class="flex-1 bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 rounded-xl px-4 py-2.5 text-base text-zinc-900 dark:text-white focus:outline-none focus:border-accent">
                                <input type="file" id="profile-file-input" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
                                <button onclick="document.getElementById('profile-file-input').click()" class="px-4 py-2.5 bg-zinc-200 dark:bg-zinc-800 text-zinc-700 dark:text-zinc-300 rounded-xl font-medium text-sm">파일 찾기</button>
                            </div>
                        </div>
                        <button onclick="saveProfileChanges()" class="w-full bg-accent text-white py-3 rounded-xl font-bold text-base shadow-lg shadow-accent/20 hover:opacity-90 transition-opacity">저장하기</button>
                    </div>
                </div>

                <div class="space-y-4">
                    <h3 class="text-xl font-bold text-zinc-900 dark:text-white">최근 남긴 감상 목록</h3>
                    <div id="profile-recent-feed" class="space-y-3"></div>
                </div>
            </section>

        </main>
    </div>

    <!-- 날짜별 기록 리스트 모달 -->
    <div id="dayLogModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-3xl w-full max-w-lg overflow-hidden shadow-2xl">
            <div class="p-6 border-b border-zinc-200 dark:border-zinc-800 flex items-center justify-between">
                <h3 id="day-modal-title" class="text-xl font-bold text-zinc-900 dark:text-white">기록</h3>
                <div class="flex items-center gap-3">
                    <button onclick="openAddModalFromDay()" class="w-8 h-8 rounded-full bg-accent text-white flex items-center justify-center font-bold text-lg shadow-md hover:opacity-90">+</button>
                    <button onclick="closeDayModal()" class="text-zinc-400 hover:text-zinc-900 dark:hover:text-white text-2xl font-bold">✕</button>
                </div>
            </div>
            <div class="p-6 space-y-4 max-h-[70vh] overflow-y-auto" id="day-modal-items-container"></div>
        </div>
    </div>

    <!-- 기록 추가/수정 모달 -->
    <div id="recordModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-3xl w-full max-w-lg overflow-hidden shadow-2xl">
            <div class="p-6 border-b border-zinc-200 dark:border-zinc-800 flex items-center justify-between">
                <h3 id="modal-main-title" class="text-xl font-bold text-zinc-900 dark:text-white">새로운 기록 추가</h3>
                <button onclick="closeAddModal()" class="text-zinc-400 hover:text-zinc-900 dark:hover:text-white text-2xl font-bold">✕</button>
            </div>
            <div class="p-8 space-y-6 max-h-[75vh] overflow-y-auto">
                <input type="hidden" id="edit-record-id" value="">
                <div>
                    <label class="block text-sm font-semibold text-zinc-600 dark:text-zinc-400 mb-2">카테고리</label>
                    <select id="modal-category" class="w-full bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 rounded-2xl px-4 py-3 text-base text-zinc-900 dark:text-white focus:outline-none focus:border-accent">
                        <option value="movie">영화</option>
                        <option value="drama">드라마</option>
                        <option value="book">책</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-zinc-600 dark:text-zinc-400 mb-2">작품 제목 검색</label>
                    <div class="flex gap-3">
                        <input type="text" id="modal-search-query" placeholder="작품 제목을 입력 후 엔터 또는 검색" onkeydown="if(event.key==='Enter') searchExternalAPI()" class="flex-1 bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 rounded-2xl px-4 py-3 text-base text-zinc-900 dark:text-white focus:outline-none focus:border-accent">
                        <button onclick="searchExternalAPI()" class="bg-accent text-white px-6 py-3 rounded-2xl text-base font-medium hover:opacity-95">검색</button>
                    </div>
                </div>
                <div id="modal-search-results" class="max-h-48 overflow-y-auto space-y-2 border border-zinc-200 dark:border-zinc-800 rounded-2xl p-3 hidden"></div>
                <div id="modal-selected-preview" class="p-4 bg-zinc-50 dark:bg-zinc-950/80 rounded-2xl border border-zinc-200 dark:border-zinc-800 hidden flex items-center gap-4">
                    <img id="preview-img" src="" class="w-14.5 h-20 object-cover rounded-xl">
                    <div>
                        <div id="preview-title" class="text-base font-bold text-zinc-900 dark:text-white"></div>
                        <div id="preview-subtitle" class="text-sm text-zinc-500"></div>
                    </div>
                </div>
                
                <div>
                    <div class="flex justify-between text-sm font-semibold text-zinc-600 dark:text-zinc-400 mb-2">
                        <span>평점 선택 (0.1점 단위 조절)</span>
                        <span id="preview-rating-val" class="font-bold text-accent">5.0점</span>
                    </div>
                    <div class="space-y-3 bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 rounded-2xl p-4">
                        <div class="flex items-center justify-center text-3xl text-amber-400 gap-1" id="star-display-container">
                            ★★★★★
                        </div>
                        <input type="range" id="modal-rating-range" min="1.0" max="5.0" step="0.1" value="5.0" oninput="updateRatingFromRange(this.value)" class="w-full accent-accent cursor-pointer">
                    </div>
                    <input type="hidden" id="modal-rating-input" value="5.0">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-zinc-600 dark:text-zinc-400 mb-2">날짜 선택</label>
                    <input type="date" id="modal-date" class="w-full bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 rounded-2xl px-4 py-3 text-base text-zinc-900 dark:text-white focus:outline-none focus:border-accent">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-zinc-600 dark:text-zinc-400 mb-2">감상평</label>

        function renderCalendar() {

                const itemsPerRow = 8;
                let rowsCount = Math.ceil(filtered.length / itemsPerRow);

                    const sliceItems = filtered.slice(r * itemsPerRow, (r + 1) * itemsPerRow);

                        <span class="text-base font-bold text-accent">⭐ ${item.rating}</span>

        function renderRatingsAnalytics() {
            if(records.length === 0) {
                document.getElementById('avg-score-all').innerText = "0.0";
                document.getElementById('total-recorded-count').innerText = "0";
                document.getElementById('top-rated-title').innerText = "-";
                document.getElementById('score-distribution-bars').innerHTML = '';
                document.getElementById('ratings-sorted-container').innerHTML = '<div class="text-zinc-400 text-center py-6 text-base">기록된 작품이 없습니다.</div>';
                return;
            }

            const totalRating = records.reduce((sum, r) => sum + r.rating, 0);
            const avg = (totalRating / records.length).toFixed(1);
            document.getElementById('avg-score-all').innerText = avg;
            document.getElementById('total-recorded-count').innerText = records.length;
            
            const top = [...records].sort((a,b) => b.rating - a.rating)[0];
            document.getElementById('top-rated-title').innerText = top ? top.title : '-';

            const distribution = Array(10).fill(0);
            records.forEach(r => {
                let idx = Math.min(9, Math.floor((r.rating - 1.0) / 0.4));
                if(idx < 0) idx = 0;
                distribution[idx]++;
            });

            const barsContainer = document.getElementById('score-distribution-bars');
            barsContainer.innerHTML = '';
            const maxCount = Math.max(...distribution, 1);

            distribution.forEach((count, i) => {
                const heightPercent = (count / maxCount) * 100;
                let barColor = 'rgb(234, 179, 8)'; 
                if(i >= 6) barColor = 'rgb(22, 163, 74)'; 
                if(i <= 2) barColor = 'rgb(239, 68, 68)'; 

                const col = document.createElement('div');
                col.className = "flex flex-col items-center gap-2 h-full justify-end";
                col.innerHTML = `
                    <span class="text-xs font-bold text-zinc-500">${count}</span>
                    <div class="w-full rounded-t-lg transition-all shadow-sm" style="height: ${Math.max(heightPercent, 12)}%; background-color: ${barColor};"></div>
                    <span class="text-xs text-zinc-400">~${((i+1)*0.5).toFixed(1)}</span>
                `;
                barsContainer.appendChild(col);
            });

            const sortedContainer = document.getElementById('ratings-sorted-container');
            sortedContainer.innerHTML = '';
            const sortedRecords = [...records].sort((a,b) => b.rating - a.rating);

            sortedRecords.forEach(item => {
                let badgeColor = 'bg-yellow-500/10 text-yellow-600';
                if(item.rating >= 4.0) badgeColor = 'bg-emerald-500/10 text-emerald-600';
                if(item.rating <= 2.5) badgeColor = 'bg-red-500/10 text-red-600';

                const div = document.createElement('div');
                div.className = "bg-white dark:bg-zinc-900/60 border border-zinc-200 dark:border-zinc-800 rounded-2xl p-5 flex items-center justify-between gap-4 shadow-sm cursor-pointer hover:border-accent transition-all";
                div.onclick = () => openEditModal(item.id);
                div.innerHTML = `
                    <div class="flex items-center gap-4">
                        <img src="${item.image}" class="w-12 h-16 object-cover rounded-xl border border-zinc-200 dark:border-zinc-800 shadow-sm">
                        <div>
                            <h4 class="text-base font-bold text-zinc-900 dark:text-white">${item.title}</h4>
                            <p class="text-sm text-zinc-600 dark:text-zinc-400 mt-0.5">${item.subtitle}</p>
                            <span class="text-xs text-zinc-400 mt-2 block">${item.date} 감상</span>
                        </div>
                    </div>
                    <span class="px-3 py-1.5 rounded-xl font-bold text-sm ${badgeColor}">⭐ ${item.rating}점</span>
                `;
                sortedContainer.appendChild(div);
            });
        }

        function renderProfileFeed() {
            const feedContainer = document.getElementById('profile-recent-feed');

            const sorted = [...records].sort((a,b) => new Date(b.date) - new Date(a.date));

                feedContainer.appendChild(div);

        }

        function openEditModal(id) {
            const item = records.find(r => r.id === id);
            if(!item) return;

            editingRecordId = id;
            document.getElementById('edit-record-id').value = id;
            document.getElementById('modal-main-title').innerText = "기록 수정하기";
            document.getElementById('modal-delete-btn').classList.remove('hidden');
            document.getElementById('recordModal').classList.remove('hidden');

            document.getElementById('modal-category').value = item.category;
            document.getElementById('modal-search-query').value = item.title;
            document.getElementById('modal-date').value = item.date;
            document.getElementById('modal-review').value = item.subtitle;
            document.getElementById('modal-rating-range').value = item.rating;
            updateRatingFromRange(item.rating);

            selectedApiItem = {
                title: item.title,
                subtitle: item.subtitle,
                image: item.image
            };

            const preview = document.getElementById('modal-selected-preview');
            preview.classList.remove('hidden');
            document.getElementById('preview-img').src = item.image;
            document.getElementById('preview-title').innerText = item.title;
            document.getElementById('preview-subtitle').innerText = item.subtitle;
        }

        function closeAddModal() {
            document.getElementById('recordModal').classList.add('hidden');
            selectedApiItem = null;
            editingRecordId = null;
            document.getElementById('modal-search-results').classList.add('hidden');
            document.getElementById('modal-selected-preview').classList.add('hidden');
        }

        function updateRatingFromRange(val) {
            const score = parseFloat(val);
            document.getElementById('modal-rating-input').value = score;
            document.getElementById('preview-rating-val').innerText = `${score.toFixed(1)}점`;
            
            const fullStars = Math.floor(score);
            let starsHtml = '';
            for(let i=0; i<5; i++) {
                if(i < fullStars) {
                    starsHtml += '★';
                } else {
                    starsHtml += '☆';
                }
            }
            document.getElementById('star-display-container').innerText = starsHtml;
        }

        async function searchExternalAPI() {
            const query = document.getElementById('modal-search-query').value.trim();
            const category = document.getElementById('modal-category').value;
            const resultsBox = document.getElementById('modal-search-results');
            if(!query) return;

            resultsBox.innerHTML = '<div class="text-sm text-zinc-400 text-center py-3">검색 중...</div>';
            resultsBox.classList.remove('hidden');

            let items = [];
            try {
                if(category === 'book') {
                    const res = await fetch(`https://dapi.kakao.com/v3/search/book?query=${encodeURIComponent(query)}`, {
                        headers: { 'Authorization': `KakaoAK ${KAKAO_KEY}` }
                    });
                    const data = await res.json();
                    items = (data.documents || []).map(book => ({
                        title: book.title,
                        subtitle: (book.authors || []).join(', ') + ' 저',
                        image: book.thumbnail || 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=300'
                    }));
                } else {
                    const type = category === 'drama' ? 'tv' : 'movie';
                    const res = await fetch(`https://api.themoviedb.org/3/search/${type}?query=${encodeURIComponent(query)}&language=ko-KR`, {
                        headers: { 'Authorization': `Bearer ${TMDB_TOKEN}`, 'accept': 'application/json' }
                    });
                    const data = await res.json();
                    items = (data.results || []).map(item => ({
                        title: item.title || item.name,
                        subtitle: (item.overview || '줄거리 정보 없음').slice(0, 40) + '...',
                        image: item.poster_path ? `https://image.tmdb.org/t/p/w500${item.poster_path}` : 'https://images.unsplash.com/photo-1485846234645-a62644f84728?w=300'
                    }));
                }

                resultsBox.innerHTML = '';
                if(items.length === 0) {
                    resultsBox.innerHTML = '<div class="text-sm text-zinc-400 text-center py-3">검색 결과가 없습니다.</div>';
                    return;
                }

                items.forEach(item => {
                    const div = document.createElement('div');
                    div.className = "flex items-center gap-4 p-3 hover:bg-zinc-100 dark:hover:bg-zinc-800 rounded-xl cursor-pointer transition-colors";
                    div.innerHTML = `
                        <img src="${item.image}" class="w-10 h-14 object-cover rounded-lg">
                        <div class="truncate">
                            <div class="text-sm font-bold text-zinc-900 dark:text-white truncate">${item.title}</div>
                            <div class="text-xs text-zinc-500 truncate">${item.subtitle}</div>
                        </div>
                    `;
                    div.onclick = () => selectApiItem(item);
                    resultsBox.appendChild(div);
                });
            } catch(e) {
                resultsBox.innerHTML = '<div class="text-sm text-red-500 text-center py-3">검색 중 오류가 발생했습니다.</div>';
            }
        }

        function selectApiItem(item) {
            selectedApiItem = item;
            document.getElementById('modal-search-results').classList.add('hidden');
            const preview = document.getElementById('modal-selected-preview');
            preview.classList.remove('hidden');
            document.getElementById('preview-img').src = item.image;
            document.getElementById('preview-title').innerText = item.title;
            document.getElementById('preview-subtitle').innerText = item.subtitle;
        }

        function saveNewRecord() {
            if(!selectedApiItem) {
                alert('검색을 통해 기록할 작품을 선택해주세요.');
                return;
            }
            const category = document.getElementById('modal-category').value;
            const rating = parseFloat(document.getElementById('modal-rating-input').value);
            const reviewText = document.getElementById('modal-review').value || selectedApiItem.subtitle;
            const recordDate = document.getElementById('modal-date').value || new Date().toISOString().split('T')[0];

            if(editingRecordId) {
                records = records.map(r => {
                    if(r.id === editingRecordId) {
                        return {
                            ...r,
                            category,
                            title: selectedApiItem.title,
                            subtitle: reviewText,
                            rating,
                            date: recordDate,
                            image: selectedApiItem.image
                        };
                    }
                    return r;
                });
            } else {
                const newRec = {
                    id: Date.now(),
                    category,
                    title: selectedApiItem.title,
                    subtitle: reviewText,
                    rating,
                    date: recordDate,
                    image: selectedApiItem.image
                };
                records.unshift(newRec);
            }

            localStorage.setItem('mylog_records', JSON.stringify(records));

            closeAddModal();
            renderCalendar();
            renderCompletedList();
            updateStats();
            renderProfileFeed();
            renderRatingsAnalytics();
        }

        function deleteCurrentEditingRecord() {
            if(!editingRecordId) return;
            if(!confirm('정말 이 기록을 삭제하시겠습니까?')) return;
            records = records.filter(r => r.id !== editingRecordId);
            localStorage.setItem('mylog_records', JSON.stringify(records));
            closeAddModal();
            renderCalendar();
            renderCompletedList();
            updateStats();
            renderProfileFeed();
            renderRatingsAnalytics();
        }

        function deleteRecord(id) {
            if(!confirm('정말 이 기록을 삭제하시겠습니까?')) return;
            records = records.filter(r => r.id !== id);
            localStorage.setItem('mylog_records', JSON.stringify(records));
            renderCalendar();
            renderCompletedList();
            updateStats();
            renderProfileFeed();
            renderRatingsAnalytics();
        }
    </script>
</body>
</html>
